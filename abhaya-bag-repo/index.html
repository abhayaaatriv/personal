<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}:root{color-scheme:light}html,body{margin:0;height:100%}body{font:14px system-ui,sans-serif;background:#f0607c}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title data-s>Abhaya's Bag</title>
<link data-s rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;700&display=swap">
<style data-s id="appstyle">
/* Layout: crumpled coral paper backdrop with a pink orchid bag in the middle; Windows XP style windows open over it, a taskbar runs along the bottom. */
:root{
  --paper:#f0607c; --night:#1a0f2e; --night-2:#2c1650; --pink:#ff6fa8; --pink-deep:#d93a7c; --pink-soft:#ffb3d3;
  --lilac:#cbb8ff; --cream:#fff6ec; --ink:#2b1638; --gold:#ffd166; --sky:#a9c8ff; --mute:#7c6a8c;
  --xp-blue:#0a4fd6; --xp-beige:#ece9d8; --xp-green:#3b9a2a; --red:#e5503a; --focus:#5b2bd9;
  --f-display:'Anton','Impact','Arial Narrow',sans-serif;
  --f-hand:'Caveat','Comic Sans MS','Marker Felt',cursive;
  --f-ui:Tahoma,'Segoe UI',Verdana,sans-serif;
  --sk:1;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--cream);font:14px/1.4 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
#root{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.win :focus-visible,.sm :focus-visible{outline-color:var(--focus)}
.ic{display:inline-grid;place-items:center;line-height:1}
.ic svg{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- backdrop ---------- */
.bgfx{position:absolute;inset:0;z-index:0;background-color:var(--paper);
  background-image:
   radial-gradient(70% 55% at 50% 32%,#ff7f9a66 0%,transparent 72%),
   radial-gradient(60% 50% at 100% 100%,#c23a5a77 0%,transparent 70%),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='p' x='0' y='0' width='100%25' height='100%25' color-interpolation-filters='sRGB'><feTurbulence type='turbulence' baseFrequency='0.012 0.02' numOctaves='4' seed='11' result='t'/><feDiffuseLighting in='t' lighting-color='%23ffffff' surface-scale='6' result='l'><feDistantLight azimuth='235' elevation='45'/></feDiffuseLighting><feComponentTransfer in='l'><feFuncR type='linear' slope='4' intercept='-2.28'/><feFuncG type='linear' slope='4' intercept='-2.28'/><feFuncB type='linear' slope='4' intercept='-2.28'/></feComponentTransfer></filter><rect width='700' height='700' filter='url(%23p)'/></svg>");
  background-size:auto,auto,700px 700px;background-blend-mode:normal,normal,soft-light}
.disco .bgfx{animation:hue 1.4s linear infinite}
/* ---------- header ---------- */
/* header sits straight on the paper: chrome A logo at the left, white caps nav like the inspo site */
.top{position:absolute;left:0;right:0;top:0;height:56px;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px}
.mark{flex:none;padding:0;background:none;border:0;line-height:0;transform:rotate(-6deg);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mark:hover,.mark:focus-visible{transform:rotate(4deg) scale(1.1)}
.mark img{display:block;height:46px;width:auto;filter:drop-shadow(0 3px 4px #0005)}
.nav{display:flex;align-items:center;gap:4px;min-width:0}
.nl{position:relative;display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:#fff;border-radius:2px;padding:5px 9px;font:400 18px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;white-space:nowrap;text-shadow:0 1px 0 #0002;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.nl:hover{background:#ffffff26;transform:rotate(-2deg) translateY(-1px)}
.nl.work{margin-left:8px;padding:7px 13px;background:var(--cream);color:var(--ink);text-shadow:none;transform:rotate(-2deg);box-shadow:2px 3px 0 #0003}
.nl.work::before{content:"";position:absolute;left:-9px;top:-6px;width:28px;height:12px;background:#ffd166cc;transform:rotate(-32deg)}
.nl.work:hover{background:#fff;transform:rotate(1deg) translateY(-2px)}
.nl .long{display:none;font:700 12px var(--f-ui);letter-spacing:0;text-transform:none}
@media(min-width:900px){.nl .long{display:inline}}
@media(max-width:700px){.nl.hm{display:none}.mark img{height:40px}.nl{font-size:15px;padding:5px 6px}.nl.work{padding:6px 9px;margin-left:6px}.nl .ic{display:none}}

/* ---------- scene / bag ---------- */
.scene{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:64px 16px calc(44px + 4vh);pointer-events:none}
.scene>*{pointer-events:auto}
.tagline{font:700 clamp(26px,4vw,38px)/1 var(--f-hand);color:#fff;margin:0 0 6px;text-align:center;transform:rotate(-2deg);text-shadow:0 2px 0 #0002;max-width:90vw}
.bag{--bagw:min(90vw,560px,calc((100dvh - 270px)*1.03));width:var(--bagw);aspect-ratio:884/858;position:relative;container-type:inline-size;flex:none}
.bagimg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:3;pointer-events:none;filter:drop-shadow(0 1.6cqw 1.6cqw #5a0f2a55)}
.bag-hit{position:absolute;z-index:3;left:6cqw;top:58cqw;width:88cqw;height:38cqw;background:none;border:0;padding:0;border-radius:6cqw}
.item{position:absolute;z-index:2;transform:translate(-50%,0) translateY(var(--lift,0cqw)) rotate(var(--rot,0deg));transition:transform .3s cubic-bezier(.3,1.6,.5,1);cursor:pointer;filter:drop-shadow(0 1cqw 0 #0000003d);animation:idle 4.2s ease-in-out var(--dl,0s) infinite}
.item img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.item.lift{--lift:-6cqw;animation-play-state:paused}
.item.hop{animation:hop .6s cubic-bezier(.3,1.5,.5,1)}
.i-video{left:27cqw;top:30cqw;width:36cqw;--rot:-6deg;--dl:.2s}
.i-photo{left:76cqw;top:40cqw;width:34cqw;--rot:6deg;--dl:.9s}
.i-vinyl{left:51cqw;top:9cqw;width:36cqw;z-index:1;--rot:3deg;--dl:.5s}
.tag{position:absolute;z-index:5;transform:translateX(-50%) rotate(var(--r,0deg));font:700 max(20px,5.6cqw)/1 var(--f-hand);background:var(--cream);color:var(--ink);border:0;padding:.28em .7em .22em;border-radius:3px;box-shadow:0 .6cqw 0 #0003;white-space:nowrap;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.tag::before{content:"";position:absolute;left:50%;top:-.55em;width:2.4em;height:.9em;transform:translateX(-50%) rotate(-3deg);background:#ffd166bb;border-radius:2px}
.tag:hover,.tag:focus-visible{transform:translateX(-50%) rotate(var(--r,0deg)) scale(1.1)}
.t-video{left:27cqw;top:69cqw;--r:-4deg}
.t-photo{left:74cqw;top:70cqw;--r:3deg}
.t-vinyl{left:50cqw;top:80cqw;--r:-1.5deg}
.bagstk{position:absolute;z-index:4;pointer-events:none;transform:rotate(var(--r,0deg));filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 1cqw 1cqw #0004)}
.bagclip{position:absolute;z-index:4;pointer-events:none;transform:rotate(var(--r,0deg));filter:drop-shadow(0 .8cqw .8cqw #0004)}
.glint{position:absolute;z-index:6;pointer-events:none;width:5cqw;height:5cqw;animation:glint 2.6s ease-in-out var(--dl,0s) infinite;opacity:0}
.glint svg{width:100%;height:100%;fill:#fff}

/* ---------- loose stickers ---------- */
.stk{position:absolute;z-index:6;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--w)*1px*var(--sk));transform:rotate(var(--r));cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 8px #0006);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.stk:hover{transform:rotate(var(--r)) scale(1.06)}
.stk.drag{cursor:grabbing;z-index:90;transform:rotate(var(--r)) scale(1.1);transition:none}
.stk.flower{filter:drop-shadow(0 4px 5px #0005)}
.ball{position:absolute;z-index:7;right:9%;top:84px;width:calc(96px*var(--sk));transform-origin:50% -26px;animation:sway 5s ease-in-out infinite;cursor:pointer;background:none;border:0;padding:0;
  filter:drop-shadow(0 8px 10px #0007)}
.ball::before{content:"";position:absolute;left:50%;bottom:100%;width:2px;height:26px;background:#fff8;transform:translateX(-50%)}
.ball img{display:block;width:100%;pointer-events:none}
.fly{position:absolute;z-index:7;top:var(--y);left:0;width:calc(74px*var(--sk));opacity:0;cursor:pointer;background:none;border:0;padding:0;animation:var(--path) var(--d) linear var(--delay) infinite}
.fly img{display:block;width:100%;pointer-events:none;filter:drop-shadow(0 6px 5px #0005);animation:flap .22s ease-in-out infinite alternate}
.bloom{position:absolute;z-index:8;pointer-events:none;width:var(--w);margin:-40px 0 0 -40px;animation:bloom 1.8s ease-out forwards}
.spk{position:absolute;z-index:9;pointer-events:none;font-size:14px;animation:spk .8s ease-out forwards}
@media(max-width:700px){:root{--sk:.62}.hm,.stk.flower{display:none!important}.tagline{font-size:20px}}

/* ---------- windows ---------- */
#wins{position:absolute;inset:0;z-index:100;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--xp-beige);border:3px solid var(--xp-blue);border-top:0;border-radius:9px 9px 3px 3px;box-shadow:0 16px 44px #000b,0 0 0 1px #0a2a8a;color:var(--ink);animation:winpop .24s cubic-bezier(.3,1.5,.5,1)}
.win.max{left:0!important;top:56px!important;width:100%!important;height:calc(100% - 92px)!important;border-radius:0}
@media(max-width:640px){.win{left:6px!important;top:62px!important;width:calc(100% - 12px)!important;height:calc(100% - 108px)!important}}
.tb{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 8px;margin:0 -3px;border-radius:6px 6px 0 0;background:linear-gradient(#3a93ff 0,#0a5df0 12%,#0553e8 45%,#0a5df0 88%,#0a4fd6 100%);cursor:grab;touch-action:none;user-select:none}
.tb .ic{color:#fff;font-size:16px}
.ttl{flex:1;min-width:0;color:#fff;font:700 13px var(--f-ui);text-shadow:1px 1px 0 #0a2a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:24px;height:24px;border:1px solid #fff;border-radius:4px;background:linear-gradient(#5ea2ff,#2560e0);color:#fff;font:700 13px/1 var(--f-ui);display:grid;place-items:center;padding:0}
.tbtn.x{background:linear-gradient(#f39a84,#d0391f)}
.tbtn:hover{filter:brightness(1.15)}
.wbody{flex:1;min-height:0;overflow:auto;background:var(--cream);border:1px solid #7a96df;position:relative;
  background-image:radial-gradient(#e9b8cf66 1px,transparent 1.2px);background-size:18px 18px}
.win.err{left:50%!important;top:38%!important;width:min(380px,92vw)!important;height:auto!important;transform:translate(-50%,-50%);z-index:400}
.err .wbody{padding:16px;display:flex;gap:14px;align-items:flex-start;overflow:visible}
.err .x-ico{flex:none;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,#d0271a);color:#fff;font:700 22px/36px var(--f-ui);text-align:center;border:2px solid #fff;box-shadow:0 0 0 1px #8a1a10}
.err p{margin:0 0 12px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:5px 16px;border-radius:999px;border:2px solid var(--ink);background:var(--pink);color:var(--ink);font:700 14px var(--f-ui);text-decoration:none;box-shadow:2px 2px 0 var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.btn.alt{background:#fff}
.btn.gold{background:var(--gold)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}

/* ---------- reel log ---------- */
.reel-head{position:sticky;top:0;z-index:3;background:var(--cream);padding:10px 12px;border-bottom:2px dashed #e0a8c2;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search,.sel,.inp,.ta{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;min-width:0}
.search{flex:1 1 170px;border-radius:999px}
.ta{width:100%;min-height:110px;resize:vertical;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:3px 11px;font:700 12px var(--f-ui)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.reel-stats{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 14px 2px;font:700 23px var(--f-hand);color:var(--pink-deep)}
.reel-stats span b{color:var(--ink)}
.reel-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:12px}
.tix{display:flex;flex-direction:column;position:relative;background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--pink-soft);min-width:0}
.tix-btn{flex:1;display:grid;grid-template-columns:70px minmax(0,1fr);width:100%;text-align:left;background:none;border:0;padding:0;color:var(--ink);border-radius:8px}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;border-right:2px dashed var(--ink);border-radius:8px 0 0 8px;background:var(--pink)}
.tone-m .stub{background:var(--gold)}
.tone-l .stub{background:var(--lilac)}
.tone-n .stub{background:#e6e0ec}
.stub b{font:400 26px/1 var(--f-display);letter-spacing:.02em}
.stub i{font:700 10px var(--f-ui);font-style:normal;letter-spacing:.02em;text-align:center;line-height:1.1;max-width:62px;word-break:break-all}
.tix-main{display:flex;flex-direction:column;gap:3px;padding:9px 11px;min-width:0}
.tix-t{font:700 15px/1.2 var(--f-ui);overflow-wrap:anywhere}
.tix-m{font-size:12px;color:var(--mute)}
.tix-x{font:500 21px/1.1 var(--f-hand);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tix.open .tix-x{display:block;-webkit-line-clamp:unset;white-space:pre-wrap}
.tix-d{display:none;padding:0 12px 10px 82px;font-size:13px}
.tix.open .tix-d{display:block}
.tix-d a{color:var(--pink-deep);font-weight:700}
.empty{padding:34px 20px;text-align:center;font:700 27px/1.15 var(--f-hand);color:var(--mute)}
.empty small{display:block;font:400 13px var(--f-ui);margin-top:6px}

/* ---------- photo roll ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:34px 22px;padding:34px 22px 22px}
.pol{position:relative;background:#fff;border:0;padding:10px 10px 12px;text-align:left;color:var(--ink);box-shadow:0 8px 16px #0003;transform:rotate(var(--r,0deg));transition:transform .25s cubic-bezier(.3,1.6,.5,1);min-width:0}
.pol:hover,.pol:focus-visible{transform:rotate(0deg) scale(1.04) translateY(-3px)}
.pol .ph{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.pol .note{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;padding:12px;background:#ffe9f2;font:700 24px/1.05 var(--f-hand);text-align:center;overflow:hidden}
.pol .cap{display:block;margin-top:9px;font:700 25px/1 var(--f-hand);overflow-wrap:anywhere}
.pol .dt{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.pol .clip{position:absolute;top:-24px;left:50%;width:46px;transform:translateX(-50%) rotate(var(--cr,0deg));pointer-events:none;filter:drop-shadow(0 3px 2px #0004)}
.pdetail{padding:16px 20px 26px;max-width:720px;margin:0 auto}
.pdetail .bigph{display:block;max-width:100%;max-height:60vh;margin:16px auto;border:10px solid #fff;box-shadow:0 8px 20px #0004;transform:rotate(-.6deg)}
.pdetail h2{margin:12px 0 0;font:400 34px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:var(--pink-deep);overflow-wrap:anywhere}
.pdetail .dt{color:var(--mute);font-size:12px;margin-top:4px}
.pdetail .txt{font:16px/1.65 var(--f-ui);white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0}

/* ---------- vinyl ---------- */
.vwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px 26px;text-align:center}
.deck{position:relative;width:min(300px,78%);aspect-ratio:1}
.arm{overflow:visible}
.deck .rec{width:100%;height:100%;display:block;animation:spin 3.2s linear infinite;animation-play-state:paused;filter:drop-shadow(0 10px 12px #0005)}
.deck.on .rec{animation-play-state:running}
.arm{position:absolute;right:-14%;top:-6%;width:46%;transform-origin:88% 12%;transform:rotate(-24deg);transition:transform .8s cubic-bezier(.4,0,.2,1)}
.deck.on .arm{transform:rotate(6deg)}
.vwrap h2{margin:0;font:400 30px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--pink-deep)}
.vwrap p{margin:0;max-width:34ch;line-height:1.5}
.vrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- typical combo ---------- */
.cwrap{padding:18px 16px 22px}
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px;border-radius:22px;background:linear-gradient(135deg,#eef0f5,#a7afbf 50%,#eef0f5);box-shadow:inset 0 0 0 4px #fffa,0 10px 22px #0004}
.cmp{position:relative;min-height:104px;padding:14px 12px 10px;border-radius:18px;background:linear-gradient(#b7beca,#dde1ea);box-shadow:inset 0 4px 9px #0006;color:var(--ink);min-width:0}
.cmp.wide{grid-column:1/-1;min-height:0}
.cmp h3{margin:0 0 6px;font:700 25px/1 var(--f-hand);color:var(--pink-deep)}
.cmp .big{font:400 40px/1 var(--f-display);color:var(--ink)}
.cmp ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:13px}
.cmp li{overflow-wrap:anywhere}
.cmp li i{font-style:normal;color:var(--mute);margin-left:6px}
.csub{margin:14px 0 0;text-align:center;font:700 34px/1 var(--f-hand);color:var(--pink-deep);transform:rotate(-1.5deg)}

/* ---------- admin ---------- */
.wbody.admin{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px 10px 0;background:var(--xp-beige);border-bottom:2px solid #7a96df;flex:none;flex-wrap:wrap}
.tabs button{border:2px solid #7a96df;border-bottom:0;border-radius:8px 8px 0 0;background:#f7f5ea;color:var(--ink);padding:5px 14px;font:700 13px var(--f-ui);margin-bottom:-2px}
.tabs button[aria-selected="true"]{background:var(--cream);border-color:var(--ink)}
.apane{flex:1;min-height:0;overflow:auto;padding:14px}
.pubbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--xp-beige);border-top:2px solid #7a96df}
.pubmsg{font-size:12px;min-width:0;flex:1 1 180px}
.pubmsg.dirty{color:#a1194f;font-weight:700}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin-bottom:14px;padding:12px;background:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--pink-soft)}
.form .full{grid-column:1/-1}
.form h3{grid-column:1/-1;margin:0;font:700 25px var(--f-hand);color:var(--pink-deep)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font:700 12px var(--f-ui)}
.fld small{color:var(--mute);font-size:11px}
.fld .inp,.fld .sel{width:100%}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.arow{display:flex;gap:6px;align-items:center;padding:7px 8px;border-bottom:1px dashed #d8b8c8}
.arow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.arow .nm small{color:var(--mute);margin-left:6px}
.arow .ph-s{width:38px;height:38px;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 3px #0005;flex:none}
.sm-btn{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:2px 9px;font:700 12px var(--f-ui)}
.sm-btn.danger{border-color:#b3261e;color:#b3261e}
.sm-btn.danger.arm2{background:#b3261e;color:#fff}
.hint{margin:0 0 12px;color:var(--mute);font-size:12px;line-height:1.5}
.preview{max-width:100%;max-height:200px;border:6px solid #fff;box-shadow:0 3px 8px #0004}

/* ---------- taskbar / start ---------- */

    h('option', { value: 'recent' }, 'recently watched'), h('option', { value: 'rating' }, 'highest rated'), h('option', { value: 'title' }, 'A to Z'), h('option', { value: 'year' }, 'newest release'));
  const chipDefs = [['all', 'all'], ['5', '5★'], ['4', '4★ and up'], ['rev', 'with a review']];

    const btn = h('button', { class: 'tix-btn', type: 'button', 'aria-expanded': 'false', onclick: () => { const o = art.classList.toggle('open'); btn.setAttribute('aria-expanded', String(o)); Snd.play('click'); } },
      h('span', { class: 'stub' }, h('b', null, m.rating ? String(m.rating) : '–'), h('i', null, stars(m.rating))),
      h('span', { class: 'tix-main' }, h('span', { class: 'tix-t' }, m.name),
        h('span', { class: 'tix-m' }, [m.year, m.watched ? fmtDate(m.watched) : null, m.rewatch ? '↻ rewatch' : null].filter(Boolean).join(' · ')),

function compress(file, max, qual) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', qual));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file could not be read as a picture. Try a JPG or PNG.')); };
    im.src = url;
  });
}

function parseCSV(t) {
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); f = ''; if (r.length > 1 || r[0] !== '') rows.push(r); r = []; }
    else f += c;
  }
  if (f !== '' || r.length) { r.push(f); rows.push(r); }
  return rows;
}
function mergeCSV(text) {
  const rows = parseCSV(text.replace(/^﻿/, '')); if (rows.length < 2) throw new Error('That file has no rows.');
  const head = rows[0].map(x => x.trim()), ix = n => head.indexOf(n);
  if (ix('Name') < 0) throw new Error('This does not look like a Letterboxd export. It needs a Name column.');
  let added = 0, updated = 0;
  for (const r of rows.slice(1)) {
    const g = n => { const i = ix(n); return i >= 0 ? (r[i] || '').trim() : ''; };
    const name = g('Name'); if (!name) continue;
    const rec = { name, year: +g('Year') || null, rating: parseFloat(g('Rating')) || 0, watched: g('Watched Date') || g('Date') || '', logged: g('Date') || '', uri: g('Letterboxd URI'), rewatch: /^yes$/i.test(g('Rewatch')) };
    const rv = g('Review');
    const m = S.movies.find(x => rec.uri && x.uri === rec.uri) || S.movies.find(x => x.name === rec.name && x.year === rec.year && x.watched === rec.watched);
    if (m) {
      const before = JSON.stringify([m.rating, m.watched, m.rewatch, m.uri, m.review]);
      m.rating = rec.rating; m.rewatch = rec.rewatch; m.watched = rec.watched || m.watched; m.uri = rec.uri || m.uri; m.year = rec.year || m.year; if (rv) m.review = rv;
      if (before !== JSON.stringify([m.rating, m.watched, m.rewatch, m.uri, m.review])) updated++;
    } else { S.movies.push({ id: rec.uri || newId(), tags: '', review: rv, name: rec.name, year: rec.year, rating: rec.rating, watched: rec.watched, logged: rec.logged, uri: rec.uri, rewatch: rec.rewatch }); added++; }
  }
  return { added, updated };
}
function importPane() {
  const msg = h('p', { class: 'hint', role: 'status' });
  const file = h('input', { class: 'inp', id: 'im-file', type: 'file', accept: '.csv,text/csv', onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const r = mergeCSV(await f.text()); msg.textContent = 'Done: ' + r.added + ' new, ' + r.updated + ' updated. Reviews you already wrote are kept.'; if (r.added || r.updated) { afterMovies(); Snd.play('ding'); } }

}

/* ============ publishing (the page rewrites itself with the new content) ============ */
function syncPub() {
  const kb = Math.round(JSON.stringify(S).length / 1024), size = kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB';
  const msg = publishing ? 'Publishing…' : dirty ? 'You have unpublished changes. Page size about ' + size + ' of 16 MB.' : 'Everything is published. Page size about ' + size + ' of 16 MB.';
  document.querySelectorAll('.pubmsg').forEach(n => { if (n.closest('.pubbar')) { n.textContent = msg; n.classList.toggle('dirty', dirty); } });
  document.querySelectorAll('.pubbtn').forEach(b => { b.disabled = !dirty || publishing; });
  const t = $('#pubtray'); if (t) t.hidden = !(dirty && canEdit);
}
const escJSON = s => s.replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
function buildDoc() {
  const reset = document.head.querySelector('style');
  let out = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + (reset ? reset.textContent : '') + '</style></head><body>';
  document.querySelectorAll('[data-s]').forEach(n => {
    if (n.id === 'root') out += '<div data-s id="root"></div>';
    else if (n.id === 'state') out += '<script data-s id="state" type="application/json">' + escJSON(JSON.stringify(S)) + '<\/script>';
    else out += n.outerHTML;
  });
  return out + '</body></html>';
}
async function publish() {
  if (publishing || !dirty) return;
  if (!canEdit) { xpError('Access denied', 'Only the owner can publish changes.'); return; }
  const c = window.claude; let art = null;
  try { art = c && c.use ? await c.use('artifact') : null; } catch (e) {}
  if (!art) { xpError('Cannot publish here', 'Publishing only works on the live page, opened while signed in as the owner.'); return; }
  const doc = buildDoc();
  if (doc.length > 15.5 * 1024 * 1024) { xpError('Too much for one page', 'The page is over 15 MB. Delete a few big photos, then publish again.'); return; }
  publishing = true; syncPub();
  try { sessionStorage.setItem('bag-reopen', 'admin'); } catch (e) {}
  try { await art.publish(doc); dirty = false; publishing = false; Snd.play('tada'); syncPub(); balloon('Published', 'Your changes are live. The page reloads with the new version.', false); }
  catch (err) {
    publishing = false; syncPub(); try { sessionStorage.removeItem('bag-reopen'); } catch (e) {}
    const code = err && err.code;
    if (code === 'conflict') xpError('Someone saved first', 'A newer version was published while you were editing. The page will reload to it, so make your change again.');
    else if (code === 'not_granted' || code === 'not_writer') xpError('Access denied', 'This account cannot publish this page.');
    else xpError('Could not publish', (err && err.message) || 'Something went wrong. Your edits are still here, so try again.');
  }
}

/* ============ start ============ */
async function init() {
  buildScene();
  const root = $('#root');
  root.addEventListener('pointerdown', e => {
    if (!e.target.closest('.start,.sm')) closeMenu();
  });
  root.addEventListener('click', e => {
    if (e.target.closest('button,a,.win,.item,.stk,.top,.task,.tag,.fly,.sm,.balloon,.bag-hit,.ball')) return;
    const rc = root.getBoundingClientRect(); spawnBloom(e.clientX - rc.left, e.clientY - rc.top); Snd.play('pop');
  });
  document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button,a,.item')) Snd.play('click'); }, true);
  document.addEventListener('pointermove', trail);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); if (active && wins.has(active) && !e.target.closest('input,textarea,select')) closeWin(active); } });
  setInterval(tick, 30000);
  const hs = location.hash.slice(1); if (APPS[hs] && hs !== 'admin') openWin(hs);
  const c = window.claude;
  if (c && c.use) { try { const U = await c.use('user'); canEdit = !!(U && (U.canEdit() || U.isOwner())); } catch (e) {} }
  buildMenu(); syncPub();
  let re = null; try { re = sessionStorage.getItem('bag-reopen'); sessionStorage.removeItem('bag-reopen'); } catch (e) {}
  if (re === 'admin' && canEdit) openWin('admin');
  else if (!wins.size) setTimeout(() => { if (!wins.size) balloon('psst', 'Tap what is poking out of the bag. Stickers can be dragged around, and the disco ball does something.', false); }, 1400);
}
init();
})();
